<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="AI Chat —— 极简的网页版 AI 聊天应用" />
    <title>AI Chat</title>
    <script>
      // 在首屏渲染前应用主题，避免主题闪烁（对应 UI §13.4 主题持久化）
      ;(() => {
        try {
          var saved = localStorage.getItem('ai-chat-theme') || 'system'
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = saved === 'system' ? (prefersDark ? 'dark' : 'light') : saved
          if (resolved !== 'light' && resolved !== 'dark') resolved = 'light'
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
